name: Enable Pages Preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enable-pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages from preview branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          status=$(curl -sS -o /tmp/pages.json -w "%{http_code}"             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/pages"             -d '{"source":{"branch":"github-pages-preview","path":"/"}}')
          cat /tmp/pages.json
          if [ "$status" = "201" ] || [ "$status" = "204" ]; then
            exit 0
          fi
          if [ "$status" = "409" ] || [ "$status" = "422" ]; then
            status2=$(curl -sS -o /tmp/pages-update.json -w "%{http_code}"               -X PUT               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPO/pages"               -d '{"source":{"branch":"github-pages-preview","path":"/"}}')
            cat /tmp/pages-update.json
            test "$status2" = "204"
            exit $?
          fi
          echo "Unexpected HTTP status: $status"
          exit 1
